<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buku Jawapan - SPMU 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f8;
      color: #17212b;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 30px;
      background: #ffffff;
      border: 1px solid #e1e5ea;
      border-radius: 12px;
      box-shadow: 0 8px 28px rgba(20, 35, 50, 0.07);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    h2 {
      margin: 0 0 30px;
      color: #536273;
      font-size: 17px;
      line-height: 1.5;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: 17px 4px;
      border-bottom: 1px solid #e5e9ee;
      line-height: 1.5;
    }

    .label {
      color: #536273;
    }

    .value {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    #message {
      margin-top: 20px;
      color: #8a3b25;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .container {
        margin: 10px auto;
        padding: 22px 18px;
      }

      h1 {
        font-size: 23px;
      }

      h2 {
        font-size: 15px;
      }

      .row {
        grid-template-columns: 1fr;
        gap: 5px;
        padding: 14px 2px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>BUKU JAWAPAN</h1>

    <h2>
      SIJIL PELAJARAN MALAYSIA ULANGAN 2026
    </h2>

    <section id="details" hidden>

      <div class="row">
        <div class="label">Nombor Pengenalan Diri</div>
        <div class="value" id="no-pengenalan">-</div>
      </div>

      <div class="row">
        <div class="label">Nombor Angka Giliran</div>
        <div class="value" id="angka-giliran">-</div>
      </div>

      <div class="row">
        <div class="label">Kod Kertas</div>
        <div class="value" id="kod-kertas">-</div>
      </div>

      <div class="row">
        <div class="label">Nombor Kertas</div>
        <div class="value" id="nombor-kertas">-</div>
      </div>

      <div class="row">
        <div class="label">Nama Kertas</div>
        <div class="value" id="nama-kertas">-</div>
      </div>

    </section>

    <p id="message" role="status" aria-live="polite">
      Sedang memuatkan maklumat...
    </p>

  </main>

  <script>
    // Read information from the QR code URL.
    const params = new URLSearchParams(
      window.location.search
    );

    const angka = (
      params.get("angka") || ""
    ).trim().toUpperCase();

    const subjek = (
      params.get("subjek") || ""
    ).trim().toLowerCase();

    const details = document.getElementById("details");
    const message = document.getElementById("message");

    // Load a JavaScript data file.
    function loadScript(filename) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src = filename + "?v=7";

        script.onload = resolve;

        script.onerror = () => {
          reject(new Error("Unable to load " + filename));
        };

        document.body.appendChild(script);
      });
    }

    async function showRecord() {

      // Check whether the QR URL contains both parameters.
      if (!angka || !subjek) {
        message.textContent =
          "Kod QR tidak lengkap. Sila semak pautan QR.";
        return;
      }

      try {

        // Load student and subject data.
        await loadScript("students.js");
        await loadScript("subjects.js");

        // Find the student and subject.
        const student = window.STUDENTS?.[angka];
        const subject = window.SUBJECTS?.[subjek];

        // Display an error if the record cannot be found.
        if (!student || !subject) {
          message.textContent =
            "Maklumat pelajar atau mata pelajaran tidak dijumpai.";
          return;
        }

        // Display student information.
        document.getElementById("no-pengenalan").textContent =
          student.noPengenalan || "-";

        document.getElementById("angka-giliran").textContent =
          student.angkaGiliran || angka;

        // Display subject information.
        document.getElementById("kod-kertas").textContent =
          subject.kodKertas || "-";

        document.getElementById("nombor-kertas").textContent =
          subject.nomborKertas || "-";

        document.getElementById("nama-kertas").textContent =
          subject.namaKertas || "-";

        // Show the completed record.
        details.hidden = false;
        message.hidden = true;

      } catch (error) {

        message.textContent =
          "Data tidak dapat dimuatkan. Pastikan students.js " +
          "dan subjects.js berada dalam folder yang sama " +
          "dengan index.html.";

        console.error(error);
      }
    }

    showRecord();
  </script>

</body>
</html>
